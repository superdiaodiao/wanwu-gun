<!--HEAD-->
<title>小区高尔夫</title>
<meta name="description" content="一颗高尔夫球，一个小区：绕过跷跷板，顶着电风扇，躲开来往的车和大鹅，把球打进洞。">
<meta name="theme-color" content="#cfeaf5">
<!--/HEAD-->
<!--BODY-->
<canvas id="game"></canvas>
<canvas id="confetti"></canvas>
<div id="hud">
  <div id="tags"></div>
  <button id="menu-btn" type="button" aria-label="暂停一下"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
  <div id="hole"><span id="hole-num"></span><b id="hole-name"></b><span id="hole-dots" aria-hidden="true"></span></div>
  <div id="score"><span>杆数</span><b id="strokes-num">0</b><span id="par"></span><span class="sep">金币</span><b id="sweets-num" class="small">0/0</b></div>
  <button id="stars" type="button" aria-label="选院子"><small id="stars-yard"></small><i>★</i><b id="stars-num">0</b></button>
  <button id="lv-chip" type="button" aria-label="换难度"><i></i><span id="lv-name"></span></button>
  <div id="banner" hidden><div id="logo"><div class="l1">Backyard</div><div class="l2">Mini G<i>o</i>lf</div></div><div id="banner-kick"></div><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="hint">在哪都能按住，往后拉，松手击球</div>
  <div id="power" hidden><div id="power-fill"></div></div>
  <button id="skip" type="button" hidden><span>跳过这洞</span><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M5 6l8 6-8 6z"/><path d="M17 6v12"/></svg></button>
  <button id="mute" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="no" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
</div>
<div id="card" hidden>
  <div class="inner">
    <button id="card-holes" class="icon" aria-label="选洞"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg></button>
    <div class="title" id="card-title"></div>
    <div class="stars" id="card-stars"></div>
    <div class="sub" id="card-sub"></div>
    <div class="prog" id="card-prog"></div>
    <div class="yard" id="card-yard"></div>
    <div class="best" id="card-best" hidden></div>
    <div class="tip" id="card-tip" hidden></div>
    <div class="btns"><button id="card-retry" class="retry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4"/></svg><span>重打这洞</span></button><button id="card-map" class="retry" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg><span>地图</span></button><button id="card-btn">下一洞</button></div>
  </div>
</div>
<div id="menu" hidden>
  <div class="panel" id="menu-main">
    <div class="head">暂停</div>
    <button id="m-resume" class="go">接着打</button>
    <button id="m-restart" class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4h4"/></svg><span>从头打这洞</span></button>
    <button id="m-holes" class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg><span>选洞</span></button>
    <div class="levels" id="m-level" role="group" aria-label="难度"><button data-l="easy">简单</button><button data-l="normal">普通</button><button data-l="hard">困难</button></div>
    <div class="lv-note" id="m-level-note"></div>
    <div class="toggles">
      <button id="m-sound" class="tog"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path class="x" d="M3 3l18 18"/></svg><span>音效</span></button>
      <button id="m-music" class="tog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V6l10-2v11"/><circle class="fill" cx="6.5" cy="17" r="2.5"/><circle class="fill" cx="16.5" cy="15" r="2.5"/><path class="x" d="M3 3l18 18"/></svg><span>音乐</span></button>
    </div>
  </div>
  <div class="panel wide" id="menu-map" hidden>
    <div class="head"><button id="y-back" class="back" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span>选院子</span><span class="tot"><i>★</i><b id="y-stars"></b></span></div>
    <div class="played" id="y-played"></div>
    <div class="yards" id="yard-list"></div>
    <div class="levels" id="y-level" role="group" aria-label="难度"><button data-l="easy">简单</button><button data-l="normal">普通</button><button data-l="hard">困难</button></div>
    <div class="lv-note" id="y-level-note"></div>
  </div>
  <div class="panel" id="menu-level" hidden>
    <div class="head"><button id="l-back" class="back" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span>难度</span></div>
    <div class="lvopts" id="l-opts" role="group" aria-label="难度"><button data-l="easy"><b>简单</b><small>虚线一直画到第一次撞墙</small></button><button data-l="normal"><b>普通</b><small>虚线只画一小段，进洞要轻一点</small></button><button data-l="hard"><b>困难</b><small>没有虚线，只看箭头；进洞要很轻</small></button></div>
    <div class="lv-note">随时可以在右上角改</div>
  </div>
  <div class="panel wide" id="menu-holes" hidden>
    <div class="head"><button id="h-back" class="back" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span id="h-title"></span><span class="tot"><i>★</i><b id="h-stars"></b></span></div>
    <div class="grid" id="hole-grid"></div>
    <div class="round" id="h-round"></div>
  </div>
</div>
<div id="loading"><div>正在铺草皮……</div></div>
<script>
// (the first words on screen, before the game itself has downloaded: in English unless the player
// reads Chinese, chosen the way i18n/index.js chooses)
(function () {
  var q = new URLSearchParams(location.search).get('lang'), s = null;
  try { s = JSON.parse(localStorage.getItem('wanwu.lang')); } catch (e) {}
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  var lang = q === 'en' || q === 'zh' ? q : s === 'en' || s === 'zh' ? s : /^zh/i.test(nav) ? 'zh' : 'en';
  if (lang !== 'en') return;
  document.documentElement.lang = 'en';
  document.title = 'Backyard Mini Golf';
  document.querySelector('#loading div').textContent = 'Rolling out the turf\u2026';
})();
</script>
<!--/BODY-->
