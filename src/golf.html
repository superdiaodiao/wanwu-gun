<!--HEAD-->
<title>小区高尔夫</title>
<meta name="description" content="一颗高尔夫球，一个小区：绕过麻将桌，顶着电风扇，躲开共享单车和大鹅，把球打进洞。">
<meta name="theme-color" content="#cfeaf5">
<!--/HEAD-->
<!--BODY-->
<canvas id="game"></canvas>
<div id="hud">
  <div id="tags"></div>
  <div id="hole"><span id="hole-num"></span><b id="hole-name"></b></div>
  <div id="score"><span>杆数</span><b id="strokes-num">0</b><span id="par"></span><span class="sep">糖</span><b id="sweets-num" class="small">0/0</b></div>
  <div id="stars"><i>★</i><b id="stars-num">0</b></div>
  <div id="banner" hidden><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="hint">在哪都能按住，往后拉，松手击球</div>
  <div id="power" hidden><div id="power-fill"></div></div>
  <button id="mute" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="no" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
</div>
<div id="card" hidden>
  <div class="inner">
    <div class="title" id="card-title"></div>
    <div class="stars" id="card-stars"></div>
    <div class="sub" id="card-sub"></div>
    <div class="best" id="card-best" hidden></div>
    <button id="card-btn">下一洞</button>
  </div>
</div>
<div id="loading"><div>正在铺草皮……</div></div>
<!--/BODY-->
