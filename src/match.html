<!--HEAD-->
<title>收集三连</title>
<meta name="description" content="一碗零食和玩具，点一个收一个，凑齐三个一样的就消掉，把碗清空就过关。轻松解压。">
<meta name="theme-color" content="#ffe9d6">
<!--/HEAD-->
<!--BODY-->
<canvas id="game"></canvas>
<div id="hud">
  <div id="level"><span id="level-num"></span><b id="level-name"></b></div>
  <div id="left"><b id="left-num">0</b><span>个</span></div>
</div>
<div id="card" hidden>
  <div class="inner">
    <div class="title" id="card-title">清空了！</div>
    <div class="sub" id="card-sub"></div>
    <button id="card-btn">下一关</button>
  </div>
</div>
<div id="loading"><div id="loading-text">正在装碗……</div></div>
<!--/BODY-->
