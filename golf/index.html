<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小区高尔夫</title>
<meta name="description" content="一颗高尔夫球，四个院子，36 洞：从鸭子池塘、泳池派对到南瓜地和雪地，躲开车、大鹅、小猫和母鸡，穿过泥地和冰面，把球打进洞。">
<meta name="theme-color" content="#cfeaf5">
<style>
/* 小区高尔夫 — UI: white rounded pills over the sky, a big friendly card between holes. */
:root {
  color-scheme: light;
  --ink: #2f3a33;
  --dim: #5d6b61;
  --gold: #ffbf2e;
  --green: #3dbb6c;
  --num: "Baloo 2", ui-rounded, system-ui, sans-serif;
  --body: ui-rounded, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #cfeaf5; color: var(--ink); font-family: var(--body); user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > div { position: absolute; }
/* the bar at the top (#top: after the card and the menu, so over them and always live): pause, where you
   are (the yard's picture on its sky, its name, its nine holes as dots; a tap: pick a hole), the strokes
   and coins, the difficulty (a tap: pick another). The little arrow means "tap to change": only the yard
   and the difficulty have one. One row on a wide screen; on a phone held upright, two (fitHud drops
   what doesn't fit: golf/main.js) */
#top { position: fixed; inset: 0; pointer-events: none; }
#bar { position: absolute; left: 14px; right: 14px; top: 14px; display: flex; align-items: center; gap: 8px; }
#bar > *, #mute { pointer-events: auto; }
#bar .brk { display: none; }
#yard, #score, #lv-chip { flex: none; display: flex; align-items: center; height: 42px; margin: 0; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 4px 0 rgba(47, 58, 51, 0.1); color: var(--ink); font-family: var(--body); white-space: nowrap; }
#yard, #lv-chip { cursor: pointer; }
#yard { flex: 0 1 auto; min-width: 0; gap: 7px; padding: 0 6px 0 5px; }
#yard .ic { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.75); }
#yard .ic svg { width: 23px; height: 19px; }
#yard b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 800 17px var(--body); }
#yard-dots { display: flex; margin: 0 2px; }
#yard-dots .dots i { width: 8px; height: 8px; }
.caret { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #eef3ef; }
.caret svg { width: 13px; height: 13px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
#yard.open, #lv-chip.open { box-shadow: inset 0 0 0 3px #f2c94c, 0 4px 0 rgba(47, 58, 51, 0.1); }
.open > .caret svg { transform: rotate(180deg); }
#score { gap: 7px; margin: 0 auto; padding: 0 16px; }
#score span { font-size: 15px; color: var(--dim); }
#score b { font: 800 23px/1 var(--num); }
#score b.small { font-size: 18px; }
#score .sep { align-self: stretch; display: flex; align-items: center; margin: 9px 0 9px 4px; padding-left: 11px; border-left: 2px solid #e3e8e4; }
#score.nocoin .sep, #score.nocoin #sweets-num { display: none; }
#bar.dots-small #yard-dots { margin: 0; }
#bar.dots-small #yard-dots .dots { gap: 2px; }
#bar.dots-small #yard-dots .dots i { width: 7px; height: 7px; }
#bar.snug #score { gap: 5px; padding: 0 10px; }
#bar.snug #score span { font-size: 14px; }
#bar.snug #score .sep { margin-left: 0; padding-left: 6px; }
#bar.snug #lv-chip { gap: 5px; padding: 0 4px 0 10px; }
#bar.snug #lv-chip .caret { width: 22px; }
#bar.score-bare #score .lbl { display: none; }
#bar.score-bare #score .sep { padding-left: 2px; }
#bar.chip-bare #lv-name { display: none; }
#bar.no-dots #yard-dots { display: none; }
#tags { inset: 0; transition: opacity 0.5s; }
#tags.out { opacity: 0; }
#tags.dim:not(.out){opacity:.25;transition-duration:.15s}
#tags .tag { position: absolute; left: 0; top: 0; padding: 5px 12px; border-radius: 11px; background: #fff; color: var(--ink); font: 800 16px var(--body); white-space: nowrap; box-shadow: 0 3px 0 rgba(47, 58, 51, 0.15); }
/* (its point at what it names: the middle, or --to along it when it is moved aside off the flag) */
#tags .tag::after { content: ""; position: absolute; left: var(--to, 50%); bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
#tags .tag.below::after { bottom: auto; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #fff; }
#lv-chip { gap: 7px; padding: 0 6px 0 13px; font: 800 16px var(--body); }
#lv-chip i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(61, 187, 108, 0.22); }
#lv-chip.normal i { background: #1f86d1; box-shadow: 0 0 0 3px rgba(31, 134, 209, 0.22); }
#lv-chip.hard i { background: #e0524a; box-shadow: 0 0 0 3px rgba(224, 82, 74, 0.22); }
/* a yard's holes as dots: hollow till played, grey let off, then pale, green, gold by the stars got */
.dots { display: inline-flex; align-items: center; gap: 3px; }
.dots i { flex: none; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c3cdc6; }
.dots i.s0 { background: #c3cdc6; }
.dots i.s1 { background: #a6dcb6; box-shadow: none; }
.dots i.s2 { background: var(--green); box-shadow: none; }
.dots i.s3 { background: var(--gold); box-shadow: none; }
.dots i.cur { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.dots i.cur.sn { box-shadow: inset 0 0 0 2px #c3cdc6, 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.dots i.now { animation: star-pop 0.45s cubic-bezier(0.2, 1.7, 0.4, 1) 1.1s both; }
/* a hole's name: hung from just under the bar at the top (--below-hud: main.js placeBanner), clear of the
   hole; it fades by itself, or at once at the first press on the green (.out) */
#banner { left: 50%; top: var(--below-hud, 80px); width: max-content; max-width: calc(100vw - 32px); transform: translate(-50%, 0); transform-origin: 50% 0; text-align: center; color: #fff; text-shadow: 0 3px 0 rgba(47, 58, 51, 0.3); white-space: nowrap; animation: pop-top 2.6s ease-out forwards; }
#banner.out, #banner.logo.out { animation: banner-out 0.18s ease-out forwards; }
/* (the name and the line under it in a solid dark edge, drawn behind the letters: white stays readable
   over snow, ice and a busy backdrop) */
#banner-title, #banner-sub { -webkit-text-stroke: 0.13em #24402c; paint-order: stroke fill; }
#banner-title { font: 800 46px var(--body); text-shadow: 0 3px 0 rgba(31, 60, 40, 0.45), 0 0 8px rgba(31, 60, 40, 0.35); }
#banner-kick { display: inline-block; margin-bottom: 4px; padding: 3px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: var(--ink); text-shadow: none; font: 800 17px var(--body); }
#banner-kick:empty { display: none; }
#banner.logo #banner-kick { margin: 6px 0 2px; font-size: clamp(12px, 2.6vh, 16px); }
/* with the game's name over it (the first hole played): up a little longer, and everything in it sized
   to the screen's height as well as its width */
#banner.logo { animation-duration: 3.4s; }
#logo { display: none; margin-bottom: 8px; line-height: 0.92; }
#banner.logo #logo { display: block; }
#banner.logo #banner-title { font-size: clamp(20px, 5vh, 30px); }
#banner.logo #banner-sub { font-size: clamp(13px, 3vh, 18px); }
/* the name: chunky white letters in a thick green edge, a golf ball for the o */
#logo .l1 { font: 800 clamp(16px, min(4.3vh, 6vw), 30px) var(--num); color: #ffd24a; letter-spacing: 1px; text-shadow: 0 0 0 transparent, 2px 2px 0 #2c7a3a, -2px 2px 0 #2c7a3a, 2px -2px 0 #2c7a3a, -2px -2px 0 #2c7a3a, 0 5px 0 #1f5a2a; }
#logo .l2 { font: 800 clamp(36px, min(11vh, 14vw), 76px) var(--num); color: #fff; text-shadow: 3px 3px 0 #2c7a3a, -3px 3px 0 #2c7a3a, 3px -3px 0 #2c7a3a, -3px -3px 0 #2c7a3a, 0 3px 0 #2c7a3a, 0 -3px 0 #2c7a3a, 3px 0 0 #2c7a3a, -3px 0 0 #2c7a3a, 0 8px 0 #1f5a2a; }
#logo .l2 i { display: inline-block; width: 0.56em; height: 0.56em; margin: 0 0.03em; overflow: hidden; color: transparent; text-shadow: none; font-style: normal; line-height: 0.56em; border-radius: 50%; vertical-align: -0.04em; background: radial-gradient(circle at 35% 30%, #fff 0 30%, #e9eef0 55%, #c7d0d4 100%); box-shadow: 0 0 0 3px #2c7a3a, 0 6px 0 3px #1f5a2a; }
#banner-sub { font: 700 18px var(--body); margin-top: 6px; white-space: normal; text-wrap: balance; -webkit-text-stroke-width: 0.2em; text-shadow: 0 2px 0 rgba(31, 70, 40, 0.5), 0 0 6px rgba(31, 70, 40, 0.35); }
#banner-sub:empty { display: none; }
#hint { left: 50%; bottom: 26px; transform: translateX(-50%); padding: 8px 16px; border-radius: 14px; background: rgba(47, 58, 51, 0.7); color: #fff; font-size: 16px; white-space: nowrap; }
#power { left: 50%; bottom: 30px; transform: translateX(-50%); width: 200px; height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); box-shadow: 0 3px 0 rgba(47, 58, 51, 0.12); overflow: hidden; }
/* round white buttons at the corners: the menu (top left), the sound (bottom right) */
#menu-btn { flex: none; width: 42px; height: 42px; padding: 9px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 4px 0 rgba(47, 58, 51, 0.1); cursor: pointer; }
#menu-btn svg, #skip svg, #menu svg { display: block; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#menu-btn svg { width: 100%; height: 100%; stroke-width: 3.2; }
/* (offered once a hole has taken par + 3: on to the next one, this one let off) */
#hud > #skip { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 12px 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: var(--ink); font: 800 15px var(--body); box-shadow: 0 4px 0 rgba(47, 58, 51, 0.1); pointer-events: auto; cursor: pointer; animation: rise 0.35s ease-out; }
#skip svg { width: 20px; height: 20px; }
#skip .fill, #menu .fill { fill: var(--ink); }
#top > #mute { position: absolute; right: 14px; bottom: 14px; width: 42px; height: 42px; padding: 9px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 4px 0 rgba(47, 58, 51, 0.1); pointer-events: auto; cursor: pointer; }
#mute svg { display: block; width: 100%; height: 100%; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#mute .spk { fill: var(--ink); }
#mute .no, #mute.off .on { display: none; }
#mute.off .no { display: inline; }
#power-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffd34d, #ff7a3d 60%, #ff3d3d); }
/* (under the bar, which stays live over its dim) */
#card { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(var(--hud-b, 70px) + 6px) 12px 8px; background: rgba(47, 58, 51, 0.28); }
#card .inner { min-width: 300px; max-width: 100%; max-height: 100%; overflow: hidden auto; padding: clamp(14px, 3vh, 24px) clamp(18px, 4vw, 34px); border-radius: 26px; background: #fff; text-align: center; box-shadow: 0 8px 0 rgba(47, 58, 51, 0.12); animation: rise 0.35s ease-out; }
/* the result, big: HOLE IN ONE! / BIRDIE! / PAR / BOGEY…, white in a thick edge of its colour */
#card .title { --edge: #2c7a3a; font: 800 clamp(28px, min(8vh, 10vw), 50px) var(--num); line-height: 1.05; color: #fff; text-wrap: balance; animation: word-pop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
  text-shadow: 3px 3px 0 var(--edge), -3px 3px 0 var(--edge), 3px -3px 0 var(--edge), -3px -3px 0 var(--edge), 0 3px 0 var(--edge), 0 -3px 0 var(--edge), 3px 0 0 var(--edge), -3px 0 0 var(--edge), 0 5px 0 var(--edge); }
html[lang="en"] #card .title:not(.none) { text-transform: uppercase; }
html[lang="en"] #card .title.long { font-size: clamp(20px, min(6.5vh, 6.6vw), 44px); } /* (NEIGHBOURHOOD, a long word: on a phone's width) */
#card .title.ace { --edge: #d9541a; color: #ffd84a; }
#card .title.under { --edge: #1f86d1; }
#card .title.over { --edge: #6f8596; }
#card .title.none { color: var(--ink); text-shadow: none; font: 800 clamp(22px, 5vh, 30px) var(--body); animation: rise 0.35s ease-out; }
#card .stars { display: flex; justify-content: center; gap: clamp(8px, 2vw, 16px); margin: clamp(4px, 1.5vh, 10px) 0 2px; }
#card .st { position: relative; width: 88px; }
#card .st i, #card .st b { display: block; font-style: normal; font-size: clamp(34px, 7vh, 46px); line-height: 1.1; color: #dde3df; }
#card .st b { position: absolute; left: 0; right: 0; top: 0; color: var(--gold); text-shadow: 0 3px 0 #e0a10f; animation: star-pop 0.45s cubic-bezier(0.2, 1.7, 0.4, 1) both; animation-delay: var(--d); }
#card .st small { display: block; font-size: 13px; line-height: 1.25; color: #849088; text-wrap: balance; }
#card .st.on small { color: var(--ink); }
#card .sub { font-size: 16px; color: var(--dim); margin: clamp(4px, 1.2vh, 8px) 0 clamp(8px, 2.2vh, 16px); }
#card .best { margin: -6px 0 clamp(8px, 2vh, 14px); font-size: 15px; color: var(--ink); line-height: 1.6; text-wrap: balance; }
#card .best b { color: #e0670f; }
/* ("too easy?": a tap opens the menu) */
#card .best button.harder { margin-top: 2px; padding: 7px 14px 7px 16px; font: 700 15px var(--body); background: #eef3ef; color: var(--ink); box-shadow: none; }
#card .best button.harder::after { content: '\203A'; margin-left: 6px; font-size: 18px; line-height: 0; color: var(--dim); }
#card .best button.harder:active { transform: translateY(1px); box-shadow: none; }
#card .tip { margin: -4px auto clamp(8px, 2vh, 14px); max-width: 320px; padding: 6px 12px; border-radius: 12px; background: #fff6d6; color: #8a6a12; font: 700 15px var(--body); }
/* (kept in sight at the bottom when the card is taller than the screen, the rest scrolling under them) */
#card .btns { position: sticky; bottom: 0; z-index: 1; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; background: #fff; }
#card button { font: 800 19px var(--body); padding: 12px 34px; border: 0; border-radius: 999px; background: var(--green); color: #fff; box-shadow: 0 5px 0 #2a8f50; cursor: pointer; }
#card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a8f50; }
#card button.retry { display: inline-flex; align-items: center; gap: 6px; padding: 12px 20px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px #d9e2dc, 0 5px 0 #d9e2dc; }
#card button.retry:active { box-shadow: inset 0 0 0 2px #d9e2dc, 0 2px 0 #d9e2dc; }
#card button.retry svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
/* (a stroke short of the next star: the retry button is the one to press) */
#card.again button.retry { background: #fff6d6; box-shadow: inset 0 0 0 2px #f2c94c, 0 5px 0 #f2c94c; }
/* the round's strokes, hole by hole, as on a scorecard: a birdie or better in a ring, a bogey or
   worse in a box */
table.sc { margin: 0 auto; border-collapse: collapse; font: 700 14px var(--num); color: var(--ink); }
table.sc th, table.sc td { min-width: 22px; height: 24px; padding: 0 1px; text-align: center; }
table.sc th { font: 700 13px var(--body); color: var(--dim); text-align: left; padding-right: 6px; white-space: nowrap; }
table.sc th.sum { text-align: center; padding: 0 0 0 6px; font: 800 14px var(--num); color: var(--ink); border-left: 2px solid #e3e8e4; }
table.sc tr.num td { color: var(--dim); font-size: 13px; }
table.sc tr.par td { color: var(--dim); }
table.sc tr.par, table.sc tr.par th { border-bottom: 2px solid #e3e8e4; }
table.sc td span { display: inline-block; min-width: 20px; line-height: 18px; }
table.sc td span.under { border: 2px solid #1f86d1; border-radius: 50%; color: #1f86d1; }
table.sc td span.over { border: 2px solid #a3b2bc; border-radius: 4px; color: #6f8596; }
/* the yard's holes as dots on the card, the one just played popping in, and what is left to do */
#card .prog { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px; margin: calc(-1 * clamp(2px, 1vh, 8px)) 0 clamp(8px, 2vh, 14px); font: 700 14px var(--body); color: var(--dim); text-wrap: balance; }
#card .prog .dots i { width: 11px; height: 11px; }
/* the difficulties in a row, on the first card */
#card .best .lvrow { display: inline-flex; align-items: center; gap: 8px; }
#card .best .levels { display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; background: #f1f3f2; }
#card .best .levels button { position: relative; padding: 10px 14px; font: 700 15px var(--body); background: transparent; color: var(--dim); box-shadow: none; }
#card .best .levels button::after { content: ""; position: absolute; inset: -3px 0; } /* (taller to tap than it looks: 44 px; not wider, so not over the next) */
#card .best .levels button:active { transform: none; box-shadow: none; }
#card .best .levels button.on { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px #f2c94c; }
/* a yard's page, after its last hole: the hole's own parts give way to the medal dropping in, the
   yard's stars and round, and what is next */
#card:not(.yd-page) .yard { display: none; }
#card.yd-page .stars, #card.yd-page .sub, #card.yd-page .prog, #card.yd-page .best, #card.yd-page .tip, #card.yd-page #card-retry { display: none; }
#card .yard .ym { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: clamp(2px, 1vh, 8px) 0 4px; }
#card .yard .ym .medal svg { animation: medal-drop 0.75s cubic-bezier(0.2, 1.4, 0.4, 1) 0.25s both; }
/* (the whole neighbourhood's page: every yard's medal in a row, dropping in one after another) */
#card .yard .ym .row { display: flex; gap: 10px; }
#card .yard .ym .row .medal svg { width: 44px; height: 55px; animation-delay: calc(0.25s + var(--k) * 0.15s); }
#card .yard .ym b { font: 800 18px var(--body); }
#card .yard .ym b small { margin-left: 8px; color: #e0670f; font-size: 15px; }
#card .yard .sum { margin: 0 0 clamp(6px, 1.6vh, 10px); font: 700 16px var(--body); color: var(--ink); }
#card .yard .sum i { font-style: normal; color: var(--gold); }
#card .yard .sum b { color: #e0670f; }
#card .yard .lines { margin: clamp(6px, 1.6vh, 12px) 0 clamp(8px, 2vh, 14px); font: 700 15px var(--body); color: var(--dim); line-height: 1.65; text-wrap: balance; }
#card .yard .lines .goal { display: inline-block; padding: 3px 12px; border-radius: 12px; background: #fff6d6; color: #8a6a12; }
/* (short of gold: the goal is a button to the first hole short of three stars) */
#card .yard .lines button.goal { position: relative; max-width: 100%; padding: 9px 16px; font: 800 15px var(--body); line-height: 1.3; text-wrap: balance; box-shadow: inset 0 0 0 2px #f0d27a, 0 3px 0 #f0d27a; }
/* (taller to tap than it looks: about 46 px, 40 on a phone on its side) */
#card .yard .lines button.goal::after { content: ''; position: absolute; inset: -4px 0; }
#card .yard .lines button.goal:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #f0d27a, 0 1px 0 #f0d27a; }
/* (and the scorecard marks each such hole: a small hollow star by its number) */
table.sc tr.num td.short { position: relative; }
table.sc tr.num td.short::after { content: '\2606'; position: absolute; right: -3px; top: -4px; font: 700 11px var(--body); color: #e0a10f; }
#card .yard .lines .unlock { color: var(--ink); font-weight: 800; }
#card .yard .lines .fin { color: #e0670f; font-size: 18px; font-weight: 800; }
#card .yard .lines button.harder { margin-top: 4px; padding: 7px 14px 7px 16px; font: 700 15px var(--body); background: #eef3ef; color: var(--ink); box-shadow: none; }
#card .yard .lines button.harder::after { content: '\203A'; margin-left: 6px; font-size: 18px; line-height: 0; color: var(--dim); }
/* the menu: paused over the hole, picking a hole, or the difficulty. Under the bar, which stays live:
   the pause panel in the middle of what is left, the other two hung from the bar under what opened them */
#menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(var(--hud-b, 70px) + 6px) 12px 8px; background: rgba(47, 58, 51, 0.38); }
#menu.hang { align-items: flex-start; }
#menu .panel { position: relative; display: flex; flex-direction: column; gap: 10px; width: 300px; max-width: 100%; max-height: 100%; overflow: hidden auto; padding: clamp(14px, 3vh, 22px); border-radius: 26px; background: #fff; text-align: center; box-shadow: 0 8px 0 rgba(47, 58, 51, 0.12); animation: rise 0.25s ease-out; }
#menu .head { display: flex; align-items: center; justify-content: center; min-height: 36px; font: 800 24px var(--body); }
#menu button.x { position: absolute; z-index: 1; right: 12px; top: 12px; width: 36px; height: 36px; padding: 9px; border-radius: 50%; background: #eef3ef; }

#menu button.x::after { content: ""; position: absolute; inset: -5px; } /* (a bigger place to tap than it looks: 44 px or more) */
#menu button { font: 800 18px var(--body); border: 0; border-radius: 999px; cursor: pointer; color: var(--ink); }
#menu button.go { padding: 13px; background: var(--green); color: #fff; font-size: 20px; box-shadow: 0 5px 0 #2a8f50; }

#menu button.row:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #d9e2dc, 0 2px 0 #d9e2dc; }
#menu button.row svg { width: 22px; height: 22px; }
#menu .toggles { display: flex; gap: 10px; margin-top: 2px; }
#menu button.tog { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; border-radius: 18px; background: #eef8f1; font-size: 15px; box-shadow: inset 0 0 0 2px #bfe5cc; }
#menu button.tog svg { width: 28px; height: 28px; stroke: #2a8f50; }
#menu button.tog .fill { fill: #2a8f50; }
#menu button.tog .x { display: none; }
#menu button.tog.off { background: #f1f3f2; color: var(--dim); box-shadow: inset 0 0 0 2px #e0e5e2; }
#menu button.tog.off svg { stroke: #a3ada6; }
#menu button.tog.off .fill { fill: #a3ada6; }

#menu button.tog.dim { opacity: 0.45; } /* (everything off by the speaker in the corner, or CrazyGames) */
/* the difficulty's own page: the three, each with what it means, the one played lit */
#menu .lvopts { display: flex; flex-direction: column; gap: 8px; }
#menu .lvopts button { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 18px; background: #f1f3f2; text-align: left; box-shadow: inset 0 0 0 2px #e0e5e2; }
#menu .lvopts button b { flex: none; display: flex; align-items: center; gap: 8px; min-width: 76px; font: 800 18px var(--body); }
#menu .lvopts button b::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--green); }
#menu .lvopts button[data-l="normal"] b::before { background: #1f86d1; }
#menu .lvopts button[data-l="hard"] b::before { background: #e0524a; }
#menu .lvopts button small { font: 700 15px var(--body); color: var(--dim); }
#menu .lvopts button.on { background: #fff6d6; box-shadow: inset 0 0 0 3px #f2c94c; }
#menu .warn { font: 700 14px var(--body); color: #b0602a; }
/* clearing the progress: quiet grey words at the foot of the pause menu, not a button like the others; a
   tap asks first, in the same panel (.ask: everything else in it gives way), No beside a red Yes */
#menu button.link { align-self: center; margin: 0 0 -4px; padding: 8px 12px; background: none; font: 700 14px var(--body); color: #8b968f; text-decoration: underline; text-underline-offset: 3px; }
#m-confirm { display: none; flex-direction: column; gap: 10px; }
#menu #menu-main.ask > :not(#m-confirm) { display: none; }
#menu #menu-main.ask > #m-confirm { display: flex; }
#m-confirm p { margin: 0; font: 700 16px/1.45 var(--body); color: var(--ink); text-wrap: balance; }
#m-confirm .two { display: flex; gap: 10px; margin-top: 4px; }
#m-confirm .two button { flex: 1; min-width: 0; }
#menu button.danger { padding: 11px; background: #e0524a; color: #fff; box-shadow: 0 4px 0 #b63a33; }
#menu button.danger:active { transform: translateY(2px); box-shadow: 0 2px 0 #b63a33; }
#menu button#m-no:focus-visible, #menu button#m-no:focus { outline: 3px solid #f2c94c; outline-offset: 2px; }
@media (min-width: 561px) { #menu.lv { justify-content: flex-end; padding-right: 14px; } } /* (under the difficulty at the right) */
/* picking a hole: the four yards as tabs (each its sky, its picture and name, its medal in the corner
   once won, a lock till it opens), a line saying how the one shown stands, and its nine holes: three
   by three on a phone held upright, one row on its side or on a computer */
#menu #menu-pick.panel { width: 820px; margin-top: 20px; padding: 14px; overflow: visible; }
/* (its cross on the corner above the last tab, clear of that tab's medal or lock and of the difficulty
   over it: the panel hangs that much lower to make the room) */
#menu #menu-pick button.x { right: -8px; top: -22px; width: 32px; height: 32px; padding: 8px; background: #fff; box-shadow: 0 3px 0 rgba(47, 58, 51, 0.15); }
#menu #menu-pick button.x::after { inset: -12px -6px 0; } /* (not down over the tab) */
#menu .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
#menu button.tab { position: relative; padding: 0; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 #d9e2dc; }
#menu .tab::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px rgba(47, 58, 51, 0.08); pointer-events: none; }
#menu .tab .sky { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 66px; padding: 4px; }
#menu .tab svg.ic { flex: none; width: 28px; height: 23px; stroke: none; }
#menu .tab .sky b { font: 800 14px/1.1 var(--body); color: #fff; white-space: nowrap; text-shadow: 0 2px 0 rgba(31, 60, 40, 0.45), 0 0 6px rgba(31, 60, 40, 0.35); }
html[lang="en"] #menu .tab .sky b { white-space: normal; text-wrap: balance; font-size: 12.5px; line-height: 1.05; }
#menu .tab.on { box-shadow: 0 4px 0 #f2c94c; }
#menu .tab.on::after { box-shadow: inset 0 0 0 3px #f2c94c; }
#menu .tab.locked .sky { filter: grayscale(1) brightness(1.06); }
#menu .tab.locked .sky b { color: var(--dim); text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
#menu .tab .medal { position: absolute; right: 4px; top: 3px; }
#menu .tab .medal svg { width: 15px; height: 19px; }
#menu .tab svg.lk { position: absolute; right: 6px; top: 6px; width: 16px; height: 16px; stroke: #7d877f; stroke-width: 2.4; }
#menu .tab.no { animation: shake 0.3s; }
#menu .line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 8px; min-height: 24px; font: 700 15px var(--body); color: var(--dim); text-wrap: balance; }
#menu .line .ys { font: 800 17px var(--num); color: var(--ink); }
#menu .line .ys i { font-style: normal; color: var(--gold); margin-right: 3px; }
#menu .line .medal svg { width: 17px; height: 21px; }
#menu .line svg.lk { flex: none; width: 16px; height: 16px; stroke: var(--dim); stroke-width: 2.4; }
/* a yard's medal: bronze, silver, gold on a red ribbon; not won yet, a dashed ring */
.medal { display: inline-block; vertical-align: middle; }
.medal svg { display: block; width: 26px; height: 32px; stroke: none; }
#menu .medal svg { stroke: none; }
.medal circle { fill: rgba(255, 255, 255, 0.5); stroke: rgba(255, 255, 255, 0.9); stroke-width: 2; stroke-dasharray: 3 3; }
.medal .rb, .medal .st { display: none; }
.medal:not(.m0) .rb { display: inline; fill: #e0524a; }
.medal:not(.m0) .st { display: inline; fill: rgba(255, 255, 255, 0.88); }
.medal.m1 circle { fill: #e2975a; stroke: #b5672c; stroke-dasharray: none; }
.medal.m2 circle { fill: #d9e1e6; stroke: #95a4ae; stroke-dasharray: none; }
.medal.m2 .st { fill: #fff; }
.medal.m3 circle { fill: #ffd24a; stroke: #e0a10f; stroke-dasharray: none; }
.medal.small svg { width: 18px; height: 22px; }
.medal.small { margin-right: 4px; vertical-align: -5px; }
.medal.big svg { width: 88px; height: 110px; }
/* (a prize: a disc of the metal's pale tint behind it, so silver stands off the white card, coming up as
   it lands, and one shine swept across it after; the star edged in the rim's colour) */
.medal.big:not(.m0) { position: relative; isolation: isolate; }
.medal.big:not(.m0)::before { content: ''; position: absolute; z-index: -1; left: 4.7%; top: 28.75%; width: 90.6%; height: 72.5%; border-radius: 50%; background: var(--halo); animation: halo-in 0.4s ease-out 0.6s both; }
.medal.big:not(.m0)::after { content: ''; position: absolute; left: 14.06%; top: 36.25%; width: 71.88%; height: 57.5%; border-radius: 50%; pointer-events: none; background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.85) 50%, transparent 62%) no-repeat; background-size: 260% 100%; background-position: 130% 0; animation: shine 0.8s ease-in-out 1.1s both; }
.medal.big.m1 { --halo: #fbe6d3; } .medal.big.m2 { --halo: #dde8f0; } .medal.big.m3 { --halo: #fff0b8; }
.medal.big.m1 .st { stroke: #8d4c1c; } .medal.big.m2 .st { stroke: #7d8e99; } .medal.big.m3 .st { stroke: #b47a04; }
.medal.big .st { stroke-width: 0.5; stroke-opacity: 0.7; }
.medal.big.m2 .st { fill: #fff; }
@keyframes halo-in { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shine { from { background-position: 130% 0; } to { background-position: -30% 0; } }
/* the holes: each with its stars and its best (at any difficulty), "skipped" in grey, the one to play
   next ringed in gold, the ones not reached yet locked */
#menu .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
#menu .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; min-height: 74px; padding: 6px 2px 7px; border-radius: 16px; background: #eef8f1; box-shadow: inset 0 0 0 2px #bfe5cc, 0 4px 0 #bfe5cc; }
#menu .tile:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #bfe5cc, 0 2px 0 #bfe5cc; }
#menu .tile b { font: 800 24px/1 var(--num); }
#menu .tile .ss { font-size: 15px; line-height: 1.1; letter-spacing: 1px; color: #d3dbd5; }
#menu .tile .ss .on { color: var(--gold); }
#menu .tile .ss i { font-style: normal; }
#menu .tile .bs { font: 700 12px var(--body); color: var(--ink); white-space: nowrap; }
#menu .tile .bs.skip { color: #8b968f; }
#menu .tile.nx { background: #fff6d6; box-shadow: inset 0 0 0 3px #f2c94c, 0 4px 0 #f2c94c; }
#menu .tile.nx:active { box-shadow: inset 0 0 0 3px #f2c94c, 0 2px 0 #f2c94c; }
#menu .tile.nx .bs { color: #8a6a12; font-weight: 800; }
#menu .tile.locked { background: #f1f3f2; box-shadow: inset 0 0 0 2px #e0e5e2, 0 4px 0 #e0e5e2; color: #a3ada6; cursor: default; }
#menu .tile.locked:active { transform: none; }
#menu .tile.locked svg { width: 20px; height: 20px; margin: 3px 0; stroke: #a3ada6; stroke-width: 2.4; }
#menu .tile.no { animation: shake 0.3s; }
/* (under the bars and the card, so they stay readable while it falls; hidden while there is none) */
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* between holes: the card fades as a haze the yard's colour comes up over the hole, the next hole is
   built under it, and it clears (main.js dip). The tags, above it, go with the card: the next hole's
   come in on their own timer (showTags). Into another yard it turns the new yard's colour as it clears */
#dip{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .26s ease-out,background-color .26s ease-out}
#dip.on{opacity:1;transition:opacity .15s ease-in}
#dip.on + #hud #tags{opacity:0;transition-duration:.15s}
#card.leaving{opacity:0;pointer-events:none;transition:opacity .15s}
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #cfeaf5; transition: opacity 0.6s; font: 700 18px var(--body); color: var(--dim); }
#loading.done { opacity: 0; pointer-events: none; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes word-pop { 0% { transform: scale(0.3) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.06) rotate(2deg); opacity: 1; } 100% { transform: none; } }
@keyframes star-pop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 70% { transform: scale(1.2) rotate(8deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes medal-drop { 0% { transform: translateY(-46px) scale(0.6) rotate(-12deg); opacity: 0; } 65% { transform: translateY(4px) scale(1.1) rotate(4deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop-top { 0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; } 12% { transform: translate(-50%, 0) scale(1.05); opacity: 1; } 20% { transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { transform: translate(-50%, -4px); opacity: 0; } }
@keyframes banner-out { 0% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -4px); opacity: 0; } }
@media (max-width: 560px) {
  #bar { flex-wrap: wrap; row-gap: 0; }
  #bar .brk { display: block; flex-basis: 100%; height: 0; }
  #score { margin: 8px 0 0; padding: 0 12px; gap: 6px; }
  #score .sep { margin-left: 2px; padding-left: 8px; }
  #lv-chip { margin: 8px 0 0 auto; }
  #hint { bottom: 70px; } #banner-title { font-size: 36px; } #banner-sub { font-size: 15px; }
}
@media (max-width: 359px) { #score { padding: 0 9px; gap: 4px; } #score .sep { margin-left: 0; padding-left: 6px; } #score span { font-size: 12px; } #score b { font-size: 20px; } #score b.small { font-size: 16px; } #lv-chip { padding-left: 10px; gap: 5px; } table.sc th, table.sc td { min-width: 19px; padding: 0; } table.sc td span { min-width: 18px; } #menu .grid, #menu .tabs { gap: 6px; } }
/* short screens (a phone on its side): the scorecard without its par row (the rings and boxes say
   how each hole went against par), the holes without their names, everything a little tighter */
@media (max-height: 420px) {
  table.sc tr.par { display: none; }
  table.sc th, table.sc td { height: 22px; }
  #menu .panel { gap: 7px; padding: 12px 16px; }
  #menu .head { min-height: 30px; font-size: 20px; }
  #menu button.x { width: 32px; height: 32px; padding: 8px; right: 10px; top: 10px; }
  #menu button.go { padding: 10px; }
  #menu button.row { padding: 8px; }
  #menu .lvopts { gap: 6px; }
  #menu .lvopts button { padding: 7px 16px; }
  #menu button.tog { flex-direction: row; justify-content: center; gap: 6px; padding: 7px 0; }
  #menu button.tog svg { width: 22px; height: 22px; }
  #menu #menu-pick.panel { padding: 12px; gap: 8px; }
  #menu .tile { min-height: 66px; }
  /* (the card under the bar: a little tighter, so it still fits without scrolling) */
  #card { padding-top: calc(var(--hud-b, 56px) + 4px); padding-bottom: 6px; }
  #card .inner { padding: 10px 24px; }
  #card .st i, #card .st b { font-size: 32px; }
  #card .sub { margin: 2px 0 6px; }
  #card .prog, #card .best, #card .tip { margin-bottom: 6px; }
  #card button { padding: 10px 30px; }
  #card button.retry { padding: 10px 18px; }
  #card .btns { padding-bottom: 5px; }
  /* (a yard's page with no scrolling: the medal beside its name, and without the scorecard, this visit's
     count and the whole neighbourhood's, so what has opened and the goal stay in sight over the button) */
  #card.yd-page table.sc, #card .yard .lines .whole, #card .yard .lines .visit { display: none; }
  #card.yd-page .title { font-size: clamp(22px, 7.5vh, 32px); }
  #card .yard .ym { flex-direction: row; justify-content: center; gap: 10px; margin: 4px 0 2px; }
  #card .yard .ym .medal.big svg { width: 60px; height: 75px; }
  #card .yard .ym .row .medal svg { width: 30px; height: 37px; }
  #card .yard .ym .row { gap: 6px; }
  #card .yard .sum { margin-bottom: 4px; }
  #card .yard .lines { margin: 4px 0 8px; line-height: 1.5; }
  #card .yard .lines button.harder { margin-top: 2px; padding: 5px 12px 5px 14px; }
  #card .yard .lines button.goal { padding: 4px 12px; }
  #card .yard .lines button.goal::after { inset: -7px 0 -5px; }
}
@media (max-height: 360px) { #card .yard .ym .medal.big svg { width: 48px; height: 60px; } #menu-main > .head { display: none; } #menu button.link { margin: -3px 0 -6px; padding: 5px 12px; } } /* (the green 接着打 says it is paused) */
@media (max-height: 340px) { #card .yard .ym .medal.big svg { width: 40px; height: 50px; } #card .st small { display: none; } #card .st i, #card .st b { font-size: 30px; } #card .sub { margin: 2px 0 6px; } #card .inner { padding: 6px 24px; } #card .title, #card.yd-page .title { font-size: 24px; } #card .prog, #card .best, #card .tip { margin-bottom: 4px; } #card .yard .lines { margin: 2px 0 4px; line-height: 1.35; } }
/* a short phone held upright (the card starts under the two rows of the bar): a yard's page without this
   visit's count and the whole neighbourhood's, so that what has opened, the goal and "too easy?" stay in
   sight over the button with no scrolling; a shorter one still: smaller medals and stars, tighter */
/* (a phone held upright, not tall: a yard's medal beside its name, as on a phone on its side, so the
   goal and "too easy?" fit over the big button) */
@media (max-width: 560px) and (max-height: 760px) {
  #card .yard .ym.one { flex-direction: row; justify-content: center; gap: 10px; }
  #card .yard .ym.one .medal.big svg { width: 64px; height: 80px; }
}
@media (max-width: 560px) and (max-height: 720px) {
  #card .yard .lines .whole, #card .yard .lines .visit { display: none; }
}
@media (max-width: 560px) and (max-height: 600px) {
  #card .inner { padding: 10px 18px; }
  #card .title { font-size: 28px; }
  html[lang="en"] #card .title.long { font-size: 20px; }
  #card .st i, #card .st b { font-size: 34px; }
  #card .sub { margin: 2px 0 6px; }
  #card .prog, #card .best, #card .tip { margin-bottom: 6px; }
  #card .yard .ym { margin: 2px 0; }
  #card .yard .ym .medal.big svg { width: 56px; height: 70px; }
  #card .yard .ym .row .medal svg { width: 34px; height: 42px; }
  #card .yard .sum { margin-bottom: 4px; }
  #card .yard .lines { margin: 4px 0 6px; line-height: 1.5; }
  #card .yard .lines button.harder { margin-top: 2px; padding: 5px 12px 5px 14px; }
  /* (the big button and the holes' last row clear of the speaker in the corner) */
  #card button { padding: 10px 24px; font-size: 18px; }
  #card button.retry { padding: 10px 16px; }
  #menu .tile { min-height: 64px; padding: 5px 2px 6px; }
  #menu #menu-pick.panel { gap: 8px; }
}
/* a phone on its side, a computer: the tabs low with the picture beside the name, the nine holes in a row */
@media (orientation: landscape) {
  #menu .tabs .sky { flex-direction: row; gap: 8px; height: 46px; padding: 4px 22px 4px 8px; } /* (clear of the lock or the medal in the corner) */
  #menu .tab .sky b, html[lang="en"] #menu .tab .sky b { white-space: nowrap; font-size: 16px; }
  #menu .grid { grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 7px; }
}
@media (orientation: landscape) and (max-width: 700px) {
  #menu .tab .sky b, html[lang="en"] #menu .tab .sky b { font-size: 12px; }
  #menu .tabs .sky { gap: 4px; padding: 4px 16px 4px 4px; }
  #menu .tab svg.ic { width: 20px; height: 17px; }
  #menu .tab svg.lk { right: 3px; top: 4px; width: 13px; height: 13px; }
  #menu .tab .medal { right: 2px; top: 2px; }
  #menu .grid { gap: 5px; }
  #menu .tile .bs { font-size: 11px; letter-spacing: -0.3px; }
  #menu .tile .ss { font-size: 13px; letter-spacing: 0; }
}

<body>
<canvas id="game"></canvas>
<canvas id="confetti"></canvas>
<div id="dip" hidden></div>
<div id="hud">
  <div id="tags"></div>
  <div id="banner" hidden><div id="logo"><div class="l1">Backyard</div><div class="l2">Mini G<i>o</i>lf</div></div><div id="banner-kick"></div><div id="banner-title"></div><div id="banner-sub"></div></div>

</div>

  </div>
</div>
<div id="menu" hidden>
  <div class="panel" id="menu-main">
    <div class="head">暂停</div>
